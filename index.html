  <!-- React + ReactDOM -->
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone for JSX transformation -->
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

  <!-- App Code -->
  <script type="text/babel" data-presets="react">
import React, { useState, useRef, useEffect, useMemo, useCallback } from "react";

const STAGE_PRESETS = [
  { id:"proscenium", label:"במה רגילה",   icon:"🎭", w:16,  h:10, bg:"#0d0d1a", line:"#e94560", shape:"rect" },
  { id:"square",     label:"במה ריבועית", icon:"⬛", w:12,  h:12, bg:"#0a1520", line:"#00d2ff", shape:"rect" },
  { id:"round",      label:"במה עגולה",   icon:"⭕", w:12,  h:12, bg:"#12002a", line:"#c77dff", shape:"circle" },
  { id:"basketball", label:"כדורסל",      icon:"🏀", w:28,  h:15, bg:"#1a100a", line:"#f5a623", shape:"rect" },
  { id:"football",   label:"כדורגל",      icon:"⚽", w:105, h:68, bg:"#051505", line:"#4caf50", shape:"rect" },
  { id:"custom",     label:"מותאם",       icon:"📐", w:20,  h:15, bg:"#111",    line:"#ffffff", shape:"rect" },
];

const FORMATIONS = [
  { id:"free",           label:"חופשי",         icon:"✦" },
  { id:"circle",         label:"עיגול",         icon:"◯" },
  { id:"semicircle_out", label:"חצי עיגול חוץ", icon:"⌢" },
  { id:"semicircle_in",  label:"חצי עיגול פנים",icon:"⌣" },
  { id:"grid",           label:"רשת",           icon:"⊞" },
  { id:"triangle",       label:"משולש",         icon:"△" },
  { id:"line",           label:"שורה",          icon:"▬" },
  { id:"diagonal_lr",    label:"אלכסון ↘",      icon:"╲" },
  { id:"diagonal_rl",    label:"אלכסון ↙",      icon:"╱" },
  { id:"x_cross",        label:"X צלב",         icon:"✕" },
  { id:"v",              label:"V",             icon:"V" },
  { id:"diamond",        label:"מעויין",        icon:"◇" },
];

const DIRS = ["↑","↗","→","↘","↓","↙","←","↖"];
const CW = 680, CH = 390;

function lerp(a,b,t){ return a+(b-a)*t; }
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
function easeInOut(t){ return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2; }

function formationPositions(id, n, W, H) {
  const cx=W/2, cy=H/2, pts=[];
  if (id==="free") {
    // spread in a loose grid so each dancer is individually draggable
    const cols=Math.ceil(Math.sqrt(n));
    const rows=Math.ceil(n/cols);
    const spacingX=Math.min(W*0.6/Math.max(cols,1), W*0.12);
    const spacingY=Math.min(H*0.6/Math.max(rows,1), H*0.15);
    const startX=cx-(cols-1)*spacingX/2;
    const startY=cy-(rows-1)*spacingY/2;
    for(let i=0;i<n;i++){
      const col=i%cols, row=Math.floor(i/cols);
      pts.push({x:startX+col*spacingX, y:startY+row*spacingY});
    }
  } else if (id==="circle") {
    const r=Math.min(W,H)*0.35;
    for(let i=0;i<n;i++){const a=(2*Math.PI*i/n)-Math.PI/2;pts.push({x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)});}
  } else if (id==="semicircle_out") {
    const r=Math.min(W,H)*0.38;
    for(let i=0;i<n;i++){const a=Math.PI*(i/Math.max(n-1,1));pts.push({x:cx+r*Math.cos(a),y:cy-r*0.75*Math.sin(a)});}
  } else if (id==="semicircle_in") {
    const r=Math.min(W,H)*0.38;
    for(let i=0;i<n;i++){const a=Math.PI*(i/Math.max(n-1,1));pts.push({x:cx+r*Math.cos(a),y:cy+r*0.75*Math.sin(a)});}
  } else if (id==="grid") {
    const cols=Math.ceil(Math.sqrt(n));const sx=W*0.7/Math.max(cols-1,1);const sy=H*0.7/Math.max(Math.ceil(n/cols)-1,1);
    for(let i=0;i<n;i++)pts.push({x:cx-W*0.35+(i%cols)*sx,y:cy-H*0.35+Math.floor(i/cols)*sy});
  } else if (id==="triangle") {
    let row=0,placed=0;const totalRows=Math.ceil((-1+Math.sqrt(1+8*n))/2);const sy=H*0.6/Math.max(totalRows-1,1);
    while(placed<n){const ir=row+1;const sx2=W*0.6/Math.max(ir,1);for(let j=0;j<ir&&placed<n;j++,placed++)pts.push({x:cx-(ir-1)*sx2/2+j*sx2,y:cy-(totalRows-1)*sy/2+row*sy});row++;}
  } else if (id==="line") {
    const sp=W*0.7/Math.max(n-1,1);for(let i=0;i<n;i++)pts.push({x:cx-W*0.35+i*sp,y:cy});
  } else if (id==="diagonal_lr") {
    for(let i=0;i<n;i++)pts.push({x:cx-W*0.35+i*(W*0.7/Math.max(n-1,1)),y:cy-H*0.35+i*(H*0.7/Math.max(n-1,1))});
  } else if (id==="diagonal_rl") {
    for(let i=0;i<n;i++)pts.push({x:cx+W*0.35-i*(W*0.7/Math.max(n-1,1)),y:cy-H*0.35+i*(H*0.7/Math.max(n-1,1))});
  } else if (id==="x_cross") {
    const half=Math.ceil(n/2);
    for(let i=0;i<n;i++){const idx=i%half;const t2=idx/Math.max(half-1,1);
      if(i<half)pts.push({x:lerp(cx-W*0.35,cx+W*0.35,t2),y:lerp(cy-H*0.35,cy+H*0.35,t2)});
      else pts.push({x:lerp(cx+W*0.35,cx-W*0.35,t2),y:lerp(cy-H*0.35,cy+H*0.35,t2)});}
  } else if (id==="v") {
    for(let i=0;i<n;i++){const side=i%2===0?1:-1;const step=Math.floor(i/2);pts.push({x:cx+side*step*W*0.07,y:cy+step*H*0.1});}
  } else if (id==="diamond") {
    pts.push({x:cx,y:cy});const step2=Math.min(W,H)*0.17;let placed=1,l=1;
    while(placed<n){const d2=[[0,-1],[1,0],[0,1],[-1,0]];for(let s=0;s<4&&placed<n;s++)for(let k=0;k<l&&placed<n;k++,placed++){const nx=d2[s][0]*(l-k)+d2[(s+1)%4][0]*k;const ny=d2[s][1]*(l-k)+d2[(s+1)%4][1]*k;pts.push({x:cx+nx*step2,y:cy+ny*step2});}l++;}
  }
  return pts.slice(0,n);
}

function makeDancers(n,formation,W,H){
  return formationPositions(formation,n,W,H).map((p,i)=>({id:i,x:p.x,y:p.y,dir:0,name:`R${i+1}`,color:`hsl(${(i*137)%360},70%,62%)`}));
}

async function detectBeats(audioBuffer){
  const sr=audioBuffer.sampleRate,data=audioBuffer.getChannelData(0),winSize=Math.floor(sr*0.05);
  const beats=[];let lastBeat=-0.3;
  for(let i=0;i<data.length-winSize;i+=winSize){
    let e=0;for(let j=0;j<winSize;j++)e+=data[i+j]*data[i+j];e/=winSize;
    const t=i/sr;if(e>0.008&&t-lastBeat>0.25){beats.push(t);lastBeat=t;}
  }
  return beats;
}

function interpolateDancers(sortedKf,time){
  if(!sortedKf||sortedKf.length===0)return null;
  if(sortedKf.length===1)return sortedKf[0].dancers;
  if(time<=sortedKf[0].time)return sortedKf[0].dancers;
  if(time>=sortedKf[sortedKf.length-1].time)return sortedKf[sortedKf.length-1].dancers;
  let prev=sortedKf[0],next=sortedKf[1];
  for(let i=0;i<sortedKf.length-1;i++){if(time>=sortedKf[i].time&&time<=sortedKf[i+1].time){prev=sortedKf[i];next=sortedKf[i+1];break;}}
  const span=next.time-prev.time;
  const t=easeInOut(span>0?clamp((time-prev.time)/span,0,1):0);
  return prev.dancers.map((pd,i)=>{const nd=next.dancers[i]||pd;return{...pd,x:lerp(pd.x,nd.x,t),y:lerp(pd.y,nd.y,t)};});
}


export default function ChoreoPlan(){
  const [stagePreset,setStagePreset]=useState(STAGE_PRESETS[0]);
  const [customW,setCustomW]=useState(20);
  const [customH,setCustomH]=useState(15);
  const stage=useMemo(()=>stagePreset.id==="custom"?{...stagePreset,w:+customW,h:+customH}:stagePreset,[stagePreset,customW,customH]);

  const [dancerCount,setDancerCount]=useState(8);
  const [formation,setFormation]=useState("circle");
  const [showGrid,setShowGrid]=useState(false);
  const [gridSize,setGridSize]=useState(8); // grid cells across width
  const [snapToGrid,setSnapToGrid]=useState(false);

  // stageDancers = committed positions (what gets saved to Q)
  // editDancers  = live drag positions (shown on canvas during edit)
  const [stageDancers,setStageDancers]=useState(()=>makeDancers(8,"circle",16,10));
  const [editDancers, setEditDancers] =useState(()=>makeDancers(8,"circle",16,10));
  const [hasUnsaved,setHasUnsaved]=useState(false);
  const nextDancerIdRef=useRef(8);

  const [selectedId,setSelectedId]=useState(null);
  const draggingRef=useRef(null);
  const dragOffsetRef=useRef({dx:0,dy:0});

  const [keyframes,setKeyframes]=useState([]);
  const [activeKf,setActiveKf]=useState(null);
  const activeKfRef=useRef(null);
  useEffect(()=>{activeKfRef.current=activeKf;},[activeKf]);

  // ── Web Audio API engine (no HTML <audio> needed) ────────────────────────
  const [fileName,setFileName]=useState("");
  const [beats,setBeats]=useState([]);
  const [duration,setDuration]=useState(0);
  const durationRef=useRef(0);
  const [isPlaying,setIsPlaying]=useState(false);
  const isPlayingRef=useRef(false);
  const [displayTime,setDisplayTime]=useState(0);
  const [renderDancers,setRenderDancers]=useState(()=>makeDancers(8,"circle",16,10));
  const [beatFlash,setBeatFlash]=useState(false);
  const [audioReady,setAudioReady]=useState(false);
  const [loadingAudio,setLoadingAudio]=useState(false);

  const actxRef=useRef(null);
  const audioBufRef=useRef(null);
  const sourceRef=useRef(null);
  const startTimeRef=useRef(0);
  const offsetRef=useRef(0);

  const fileInputRef=useRef(null);
  const svgRef=useRef(null);

  // Prevent page scroll while dragging on SVG (React touch events are passive by default)
  useEffect(()=>{
    const el=svgRef.current;
    if(!el)return;
    const prevent=(e)=>{
      if(draggingRef.current!==null) e.preventDefault();
    };
    el.addEventListener("touchmove",prevent,{passive:false});
    el.addEventListener("touchstart",prevent,{passive:false});
    return()=>{
      el.removeEventListener("touchmove",prevent);
      el.removeEventListener("touchstart",prevent);
    };
  },[]);
  const scrubberRef=useRef(null);
  const rafRef=useRef(null);
  const isScrubbing=useRef(false);
  const wasPlaying=useRef(false);
  const beatFlashRef=useRef(false);
  const beatsRef=useRef([]);
  const keyframesRef=useRef([]);
  const modeRef=useRef("edit");

  const [mode,setMode]=useState("edit");
  const [tab,setTab]=useState("stage");
  const [isMobile,setIsMobile]=useState(false);
  useEffect(()=>{
    const chk=()=>setIsMobile(window.innerWidth<700);
    chk();
    window.addEventListener("resize",chk);
    return()=>window.removeEventListener("resize",chk);
  },[]);

  // keep keyframesRef always in sync (useEffect is async, so we also update inline)
  useEffect(()=>{keyframesRef.current=[...keyframes].sort((a,b)=>a.time-b.time);},[keyframes]);
  useEffect(()=>{modeRef.current=mode;},[mode]);
  useEffect(()=>{beatsRef.current=beats;},[beats]);

  const getActx=()=>{
    if(!actxRef.current) actxRef.current=new(window.AudioContext||window.webkitAudioContext)();
    if(actxRef.current.state==="suspended") actxRef.current.resume();
    return actxRef.current;
  };

  const getCurrentTime=useCallback(()=>{
    if(!actxRef.current||!sourceRef.current) return offsetRef.current;
    return Math.min(offsetRef.current+(actxRef.current.currentTime-startTimeRef.current),duration||0);
  },[duration]);

  // ── Animation RAF — pure refs, no stale closures ───────────────────────────
  useEffect(()=>{
    let animId;
    const tick=()=>{
      if(!isPlayingRef.current){ setBeatFlash(false); return; }
      const actx=actxRef.current;
      const s=sourceRef.current;
      const t=(actx&&s)
        ? Math.min(offsetRef.current+(actx.currentTime-startTimeRef.current), durationRef.current||9999)
        : offsetRef.current;
      setDisplayTime(t);
      const dur=durationRef.current;
      if(dur>0&&t>=dur){ isPlayingRef.current=false; setIsPlaying(false); offsetRef.current=0; return; }
      const near=beatsRef.current.some(b=>Math.abs(b-t)<0.07);
      if(near!==beatFlashRef.current){ beatFlashRef.current=near; setBeatFlash(near); }
      const kfs=keyframesRef.current;
      if(kfs.length>=2){
        const interp=interpolateDancers(kfs,t);
        if(interp) setRenderDancers(interp.map(d=>({...d,bounce:near?Math.sin(Date.now()/80)*2.5:0})));
      }
      animId=requestAnimationFrame(tick);
      rafRef.current=animId;
    };
    if(isPlaying){
      cancelAnimationFrame(rafRef.current);
      animId=requestAnimationFrame(tick);
      rafRef.current=animId;
    } else {
      cancelAnimationFrame(rafRef.current);
      setBeatFlash(false);
    }
    return()=>cancelAnimationFrame(animId);
  },[isPlaying])

  const handleAudioFile=(e)=>{
    const file=e.target.files[0];if(!file)return;
    setFileName(file.name);
    setAudioReady(false);setLoadingAudio(true);isPlayingRef.current=false; setIsPlaying(false);
    setDisplayTime(0);setBeats([]);offsetRef.current=0;
    try{sourceRef.current?.stop();}catch(_){}
    sourceRef.current=null;
    file.arrayBuffer()
      .then(ab=>getActx().decodeAudioData(ab))
      .then(buf=>{
        audioBufRef.current=buf;
        setDuration(buf.duration);
        setAudioReady(true);setLoadingAudio(false);
        return detectBeats(buf);
      })
      .then(b=>setBeats(b))
      .catch(err=>{console.error(err);setLoadingAudio(false);});
  };

  const fmt=(t)=>{if(!t||isNaN(t))return"00:00";return`${Math.floor(t/60).toString().padStart(2,"0")}:${Math.floor(t%60).toString().padStart(2,"0")}`;};

  const startPlayback=(from)=>{
    const actx=getActx(),buf=audioBufRef.current;if(!buf)return;
    try{sourceRef.current?.stop();}catch(_){}
    const src=actx.createBufferSource();
    src.buffer=buf;src.connect(actx.destination);
    src.start(0,from);
    src.onended=()=>{if(sourceRef.current===src){isPlayingRef.current=false; setIsPlaying(false);offsetRef.current=0;}};
    sourceRef.current=src;startTimeRef.current=actx.currentTime;offsetRef.current=from;
  };

  const togglePlay=()=>{
    if(!audioReady||!audioBufRef.current)return;
    if(isPlaying){
      const t=getCurrentTime();
      try{sourceRef.current?.stop();}catch(_){}
      sourceRef.current=null;offsetRef.current=t;setDisplayTime(t);isPlayingRef.current=false; setIsPlaying(false);
    }else{
      // auto-switch to preview so animation runs
      setMode("preview");
      modeRef.current="preview";
      startPlayback(offsetRef.current);isPlayingRef.current=true; setIsPlaying(true);
    }
  };

  const seekTo=useCallback((t2real)=>{
    const t2=clamp(t2real,0,duration||0);
    offsetRef.current=t2;
    setDisplayTime(t2);
    if(isPlaying) startPlayback(t2); // restart from new position
    // show interpolated position immediately on scrub
    const kfs=keyframesRef.current;
    if(kfs.length>=2){
      const interp=interpolateDancers(kfs,t2);
      if(interp) setRenderDancers(interp);
    }
  },[isPlaying,duration]);

  const getScrubTime=(cx)=>{const el=scrubberRef.current;if(!el)return 0;const r=el.getBoundingClientRect();return clamp(((cx-r.left)/r.width)*(duration||0),0,duration||0);};

  const onScrubStart=(e)=>{
    e.preventDefault();isScrubbing.current=true;wasPlaying.current=isPlaying;
    if(isPlaying){try{sourceRef.current?.stop();}catch(_){}sourceRef.current=null;isPlayingRef.current=false; setIsPlaying(false);}
    seekTo(getScrubTime(e.clientX));
    const move=(ev)=>{if(isScrubbing.current)seekTo(getScrubTime(ev.clientX));};
    const up=()=>{
      isScrubbing.current=false;
      if(wasPlaying.current){startPlayback(offsetRef.current);isPlayingRef.current=true; setIsPlaying(true);}
      window.removeEventListener("mousemove",move);window.removeEventListener("mouseup",up);
    };
    window.addEventListener("mousemove",move);window.addEventListener("mouseup",up);
  };

  // Stage scale
  const sc=useMemo(()=>{
    const s=Math.min(CW/stage.w,CH/stage.h)*0.88;
    const pw=stage.w*s,ph=stage.h*s;
    return{s,pw,ph,ox:(CW-pw)/2,oy:(CH-ph)/2};
  },[stage]);

  const toPixel=(x,y)=>({px:sc.ox+x*sc.s,py:sc.oy+y*sc.s});
  const toStage=(px,py)=>({x:(px-sc.ox)/sc.s,y:(py-sc.oy)/sc.s});

  // Reset on stage/count change
  useEffect(()=>{
    const d=makeDancers(dancerCount,formation,stage.w,stage.h);
    nextDancerIdRef.current=dancerCount;
    setStageDancers(d);setEditDancers(d);setRenderDancers(d);
    setKeyframes([]);setActiveKf(null);setSelectedId(null);setHasUnsaved(false);
  },[stage.id,customW,customH]); // NOTE: dancerCount removed — add/remove handles its own updates

  // Apply formation to edit (without committing)
  const applyFormation=(fid)=>{
    setFormation(fid);
    const pts=formationPositions(fid,dancerCount,stage.w,stage.h);
    setEditDancers(prev=>prev.map((d,i)=>pts[i]?{...d,x:pts[i].x,y:pts[i].y}:d));
    setHasUnsaved(true);
  };

  // Commit positions
  const commitPositions=()=>{
    const dancers=editDancers.map(d=>({...d}));
    setStageDancers(dancers);
    setHasUnsaved(false);
    // if a Q is currently active, auto-update it with new positions
    const kf=activeKfRef.current;
    if(kf){
      const updated={...kf, dancers, formation};
      const newKfs=keyframes.map(k=>k===kf?updated:k).sort((a,b)=>a.time-b.time);
      keyframesRef.current=newKfs;
      setKeyframes(prev=>prev.map(k=>k===kf?updated:k));
      setActiveKf(updated);
      activeKfRef.current=updated;
    }
  };

  // Discard
  const discardChanges=()=>{
    setEditDancers(stageDancers.map(d=>({...d})));
    setHasUnsaved(false);
  };

  // Add single dancer at center
  const addDancer=()=>{
    const id=nextDancerIdRef.current++;
    const newD={id,x:stage.w/2,y:stage.h/2,dir:0,name:`R${id+1}`,color:`hsl(${(id*137)%360},70%,62%)`};
    setEditDancers(prev=>[...prev,newD]);
    setDancerCount(prev=>prev+1);
    setHasUnsaved(true);
  };

  // Remove selected dancer
  const removeSelected=()=>{
    if(selectedId===null)return;
    setEditDancers(prev=>prev.filter(d=>d.id!==selectedId));
    setStageDancers(prev=>prev.filter(d=>d.id!==selectedId));
    setDancerCount(prev=>Math.max(1,prev-1));
    setSelectedId(null);
    setHasUnsaved(true);
  };

  // Canvas drag — moves editDancers only
  const onMouseDown=(e)=>{
    if(mode==="preview")return;
    const rect=svgRef.current.getBoundingClientRect();
    const mx=e.clientX-rect.left,my=e.clientY-rect.top;
    for(const d of editDancers){
      const{px,py}=toPixel(d.x,d.y);
      if(Math.hypot(mx-px,my-py)<16){
        draggingRef.current=d.id;
        dragOffsetRef.current={dx:mx-px,dy:my-py};
        setSelectedId(d.id);
        return;
      }
    }
    setSelectedId(null);
  };

  const onMouseMove=(e)=>{
    if(draggingRef.current===null||mode==="preview")return;
    const rect=svgRef.current.getBoundingClientRect();
    const mx=e.clientX-rect.left-dragOffsetRef.current.dx;
    const my=e.clientY-rect.top-dragOffsetRef.current.dy;
    let{x,y}=toStage(mx,my);
    if(snapToGrid){
      const cellW=stage.w/gridSize, cellH=stage.h/gridSize;
      x=Math.round(x/cellW)*cellW; y=Math.round(y/cellH)*cellH;
    }
    setEditDancers(prev=>prev.map(d=>d.id===draggingRef.current?{...d,x:clamp(x,0,stage.w),y:clamp(y,0,stage.h)}:d));
    setHasUnsaved(true);
  };

  const onMouseUp=()=>{
    draggingRef.current=null;
    // auto-save drag to active Q
    if(activeKfRef.current&&hasUnsaved){
      // slight delay so state settles
      setTimeout(()=>{
        if(activeKfRef.current) commitPositions();
      },50);
    }
  };

  // Keyframes
  const addKeyframe=()=>{
    const snap=beats.find(b=>Math.abs(b-displayTime)<0.12);
    const time=snap!==undefined?snap:displayTime;
    const existing=keyframes.find(k=>Math.abs(k.time-time)<0.08);
    // always save the currently visible (edit) positions — auto-commit
    const dancers=editDancers.map(d=>({...d}));
    // commit stage without triggering RAF reset
    setStageDancers(dancers);
    setHasUnsaved(false);
    if(existing){
      const updated={...existing,dancers,formation};
      const newKfs=keyframes.map(k=>k===existing?updated:k).sort((a,b)=>a.time-b.time);
      keyframesRef.current=newKfs;
      setKeyframes(prev=>prev.map(k=>k===existing?updated:k));
      setActiveKf(updated);
      return;
    }
    const kf={time,dancers,formation,label:`Q${keyframes.length+1}`};
    // update ref synchronously so RAF sees it immediately
    keyframesRef.current=[...keyframes,kf].sort((a,b)=>a.time-b.time);
    setKeyframes(prev=>[...prev,kf]);
    setActiveKf(kf);
  };

  const loadKeyframe=(kf)=>{
    setStageDancers(kf.dancers.map(d=>({...d})));
    setEditDancers(kf.dancers.map(d=>({...d})));
    setRenderDancers(kf.dancers.map(d=>({...d})));
    setFormation(kf.formation||formation);
    seekTo(kf.time);setActiveKf(kf);setMode("edit");setHasUnsaved(false);
    if(isPlaying){try{sourceRef.current?.stop();}catch(_){}sourceRef.current=null;isPlayingRef.current=false; setIsPlaying(false);}
  };

  const deleteKf=(kf,e)=>{e.stopPropagation();setKeyframes(prev=>prev.filter(k=>k!==kf));if(activeKf===kf)setActiveKf(null);};

  const sortedKf=useMemo(()=>[...keyframes].sort((a,b)=>a.time-b.time),[keyframes]);
  const nextCue=useMemo(()=>sortedKf.find(k=>k.time>displayTime+0.1),[sortedKf,displayTime]);
  const timeToNext=nextCue?(nextCue.time-displayTime):null;
  const pct=duration?clamp((displayTime/duration)*100,0,100):0;

  // while playing: show animated renderDancers; while editing: show editable editDancers
  const displayList=isPlaying?renderDancers:editDancers;

  const stageEl=(fill,stroke,sw=2)=>stage.shape==="circle"
    ?React.createElement("ellipse",{cx:sc.ox+sc.pw/2,cy:sc.oy+sc.ph/2,rx:sc.pw/2,ry:sc.ph/2,fill:fill,stroke:stroke,strokeWidth:sw})
    :React.createElement("rect",{x:sc.ox,y:sc.oy,width:sc.pw,height:sc.ph,fill:fill,stroke:stroke,strokeWidth:sw,rx:3});

  const clipEl=()=>stage.shape==="circle"
    ?React.createElement("ellipse",{cx:sc.ox+sc.pw/2,cy:sc.oy+sc.ph/2,rx:sc.pw/2,ry:sc.ph/2})
    :React.createElement("rect",{x:sc.ox,y:sc.oy,width:sc.pw,height:sc.ph,rx:3});

  return(
    <div style={{height:"100vh",background:"#06080f",color:"#dde4f0",fontFamily:"Segoe UI,system-ui,sans-serif",display:"flex",flexDirection:"column",direction:"rtl",overflow:"hidden",userSelect:"none",touchAction:"none",WebkitOverflowScrolling:"none"}}>

      {/* AUDIO — always mounted */}

      {/* TOP BAR */}
      <div style={{background:"#0b0f1a",borderBottom:"1px solid #1a2540",padding:"9px 18px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:32,height:32,borderRadius:"50%",background:"linear-gradient(135deg,#e94560,#0f3460)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,boxShadow:"0 0 12px #e9456055"}}>🎭</div>
          <div>
            <div style={{fontWeight:800,fontSize:15,color:"#fff"}}>ChoreoPlan</div>
            <div style={{fontSize:9,color:"#2a4060",letterSpacing:2}}>CHOREOGRAPHY DESIGNER</div>
          </div>
        </div>
        {!isMobile&&<div style={{display:"flex",gap:5}}>
          {["stage","dancers","music"].map(t=>(
            <button key={t} onClick={()=>setTab(t)} style={{padding:"6px 13px",borderRadius:7,border:"none",background:tab===t?"linear-gradient(135deg,#e94560,#c2185b)":"#111827",color:tab===t?"#fff":"#4a6080",fontWeight:700,fontSize:11,cursor:"pointer"}}>
              {t==="stage"?"🎪 במה":t==="dancers"?"💃 רקדנים":"🎵 מוסיקה"}
            </button>
          ))}
        </div>}
        <div style={{display:"flex",gap:7,alignItems:"center"}}>
          <div style={{fontSize:10,color:"#2a4060",padding:"4px 9px",background:"#0d1117",borderRadius:6,border:"1px solid #1a2540"}}>
            {stage.label} {stage.w}×{stage.h}m | {dancerCount}👤 | {keyframes.length}Q
          </div>
          <button onClick={()=>{const nm=mode==="edit"?"preview":"edit";setMode(nm);if(nm==="edit"&&isPlaying){try{sourceRef.current?.stop();}catch(_){}sourceRef.current=null;isPlayingRef.current=false; setIsPlaying(false);}}} style={{padding:"6px 14px",borderRadius:7,border:"none",background:mode==="preview"?"linear-gradient(135deg,#00b09b,#007055)":"#1a2540",color:"#fff",fontWeight:700,fontSize:11,cursor:"pointer",boxShadow:mode==="preview"?"0 0 10px #00b09b55":"none"}}>
            {mode==="preview"?"✏️ עריכה":"👁 תצוגה"}
          </button>
        </div>
      </div>

      <div style={{display:"flex",flex:1,overflow:"hidden"}}>

        {/* SIDEBAR — hidden on mobile */}
        <div style={{width:isMobile?0:252,background:"#0b0f1a",borderLeft:"1px solid #1a2540",padding:isMobile?0:13,overflowY:"auto",flexShrink:0,display:"flex",flexDirection:"column",gap:13,overflow:"hidden",transition:"width .2s",touchAction:"pan-y"}}>

          {tab==="stage"&&<>
            <div style={{fontSize:11,color:"#e94560",fontWeight:700,letterSpacing:2}}>סוג במה</div>
            {STAGE_PRESETS.map(sp=>(
              <button key={sp.id} onClick={()=>setStagePreset(sp)} style={{padding:"8px 11px",borderRadius:9,border:"1px solid",borderColor:stagePreset.id===sp.id?"#e94560":"#1a2540",background:stagePreset.id===sp.id?"#1a0810":"#111827",color:stagePreset.id===sp.id?"#e94560":"#6a7a8a",display:"flex",alignItems:"center",gap:10,cursor:"pointer",boxShadow:stagePreset.id===sp.id?"0 0 10px #e9456033":"none"}}>
                <span style={{fontSize:16}}>{sp.icon}</span>
                <div><div style={{fontWeight:700,fontSize:12}}>{sp.label}</div>{sp.id!=="custom"&&<div style={{fontSize:10,color:"#2a3a4a"}}>{sp.w}×{sp.h} מ׳</div>}</div>
              </button>
            ))}
            {stagePreset.id==="custom"&&(
              <div style={{padding:11,background:"#111827",borderRadius:9,border:"1px solid #1a2540"}}>
                <div style={{display:"flex",gap:7,alignItems:"flex-end"}}>
                  <div style={{flex:1}}><div style={{fontSize:10,color:"#2a3a4a",marginBottom:3}}>רוחב</div><input type="number" value={customW} min={4} max={200} onChange={e=>setCustomW(e.target.value)} style={{width:"100%",padding:"6px",background:"#0b0f1a",border:"1px solid #1e2d40",borderRadius:6,color:"#dde4f0",fontSize:12}}/></div>
                  <span style={{color:"#2a3a4a",paddingBottom:7}}>×</span>
                  <div style={{flex:1}}><div style={{fontSize:10,color:"#2a3a4a",marginBottom:3}}>גובה</div><input type="number" value={customH} min={4} max={200} onChange={e=>setCustomH(e.target.value)} style={{width:"100%",padding:"6px",background:"#0b0f1a",border:"1px solid #1e2d40",borderRadius:6,color:"#dde4f0",fontSize:12}}/></div>
                </div>
              </div>
            )}
          </>}

          {tab==="dancers"&&<>
            <div style={{fontSize:11,color:"#e94560",fontWeight:700,letterSpacing:2}}>רקדנים</div>

            {/* Add / Remove */}
            <div style={{display:"flex",gap:5}}>
              <button onClick={addDancer} style={{flex:1,padding:"8px 0",borderRadius:8,border:"none",background:"linear-gradient(135deg,#0f3460,#1565c0)",color:"#fff",fontWeight:800,fontSize:13,cursor:"pointer",boxShadow:"0 0 8px #1565c033"}}>＋ רקדן</button>
              <button onClick={removeSelected} disabled={selectedId===null} style={{flex:1,padding:"8px 0",borderRadius:8,border:"none",background:selectedId!==null?"linear-gradient(135deg,#e94560,#c2185b)":"#1a2540",color:selectedId!==null?"#fff":"#444",fontWeight:800,fontSize:13,cursor:selectedId!==null?"pointer":"default"}}>－ הסר</button>
            </div>
            <div style={{fontSize:10,color:"#2a4060",textAlign:"center",marginTop:-6}}>
              סה"כ: <strong style={{color:"#e94560"}}>{editDancers.length}</strong> רקדנים
            </div>

            {/* Formation */}
            <div>
              <div style={{fontSize:11,color:"#6a7a8a",marginBottom:6}}>פורמציה</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:4}}>
                {FORMATIONS.map(f=>(
                  <button key={f.id} onClick={()=>applyFormation(f.id)} style={{padding:"7px 4px",borderRadius:8,border:"1px solid",borderColor:formation===f.id?"#00d2ff":"#1a2540",background:formation===f.id?"#001a22":"#111827",color:formation===f.id?"#00d2ff":"#6a7a8a",cursor:"pointer",fontWeight:700,fontSize:10,boxShadow:formation===f.id?"0 0 7px #00d2ff33":"none"}}>
                    <div style={{fontSize:15}}>{f.icon}</div><div style={{fontSize:8,marginTop:1}}>{f.label}</div>
                  </button>
                ))}
              </div>
            </div>

            {/* Snap Grid controls */}
            <div style={{padding:10,background:"#111827",borderRadius:9,border:"1px solid #1a2540"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <span style={{fontSize:11,color:"#6a7a8a",fontWeight:700}}>🔲 רשת פרופורציה</span>
                <div style={{display:"flex",gap:5}}>
                  <button onClick={()=>setShowGrid(g=>!g)} style={{padding:"4px 10px",borderRadius:6,border:"1px solid",borderColor:showGrid?"#00d2ff":"#1a2540",background:showGrid?"#001a22":"#0b0f1a",color:showGrid?"#00d2ff":"#445566",fontSize:10,cursor:"pointer",fontWeight:700}}>
                    {showGrid?"הסתר ✓":"הצג"}
                  </button>
                  <button onClick={()=>setSnapToGrid(s=>!s)} style={{padding:"4px 10px",borderRadius:6,border:"1px solid",borderColor:snapToGrid?"#c77dff":"#1a2540",background:snapToGrid?"#1a0033":"#0b0f1a",color:snapToGrid?"#c77dff":"#445566",fontSize:10,cursor:"pointer",fontWeight:700}}>
                    {snapToGrid?"Snap ✓":"Snap"}
                  </button>
                </div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:10,color:"#445566",whiteSpace:"nowrap"}}>תאים: {gridSize}</span>
                <input type="range" min={2} max={24} value={gridSize} onChange={e=>setGridSize(+e.target.value)} style={{flex:1,accentColor:"#c77dff"}}/>
              </div>
              {showGrid&&<div style={{marginTop:6,fontSize:9,color:"#2a4060",textAlign:"center"}}>
                {stage.w/gridSize%1===0?`${stage.w/gridSize}×${stage.h/gridSize}m לתא`:`~${(stage.w/gridSize).toFixed(1)}m לתא`}
              </div>}
            </div>

            {/* Selected dancer controls */}
            {selectedId!==null&&(()=>{
              const sel=editDancers.find(d=>d.id===selectedId);if(!sel)return null;
              return(
                <div style={{padding:11,background:"#111827",borderRadius:9,border:"1px solid #1a2540"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                    <span style={{fontSize:11,color:"#e94560",fontWeight:700}}>✏️ עריכת רקדן</span>
                    <button onClick={removeSelected} style={{padding:"2px 8px",borderRadius:5,border:"1px solid #e9456066",background:"#1a0810",color:"#e94560",fontSize:10,cursor:"pointer",fontWeight:700}}>🗑 הסר</button>
                  </div>
                  <div style={{marginBottom:10}}>
                    <div style={{fontSize:10,color:"#6a7a8a",marginBottom:4}}>שם רקדן/ית</div>
                    <input type="text" value={sel.name} maxLength={12}
                      onChange={e=>{const v=e.target.value;setEditDancers(prev=>prev.map(da=>da.id===sel.id?{...da,name:v}:da));setHasUnsaved(true);}}
                      placeholder="הקלד שם..."
                      style={{width:"100%",padding:"7px 10px",background:"#0b0f1a",border:"1px solid #e9456066",borderRadius:7,color:"#fff",fontSize:13,fontWeight:700,textAlign:"right",outline:"none",boxSizing:"border-box"}}
                    />
                    <div style={{fontSize:9,color:"#2a3a4a",marginTop:3,textAlign:"left"}}>{sel.name.length}/12</div>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:10}}>
                    <div style={{width:14,height:14,borderRadius:"50%",background:sel.color,flexShrink:0,boxShadow:`0 0 5px ${sel.color}`}}/>
                    <span style={{fontSize:11,color:"#6a7a8a",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}><strong style={{color:sel.color}}>{sel.name||"ללא שם"}</strong></span>
                  </div>
                  <div style={{fontSize:10,color:"#6a7a8a",marginBottom:5}}>כיוון</div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:3}}>
                    {DIRS.map((d,i)=>(
                      <button key={i} onClick={()=>{setEditDancers(prev=>prev.map(da=>da.id===sel.id?{...da,dir:i}:da));setHasUnsaved(true);}} style={{padding:"5px 0",borderRadius:6,border:"1px solid",borderColor:sel.dir===i?"#c77dff":"#1a2540",background:sel.dir===i?"#1a0033":"#0d1117",color:"#dde4f0",cursor:"pointer",fontSize:12}}>{d}</button>
                    ))}
                  </div>
                </div>
              );
            })()}

            {/* Confirm / Discard */}
            {hasUnsaved&&(
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                <button onClick={commitPositions} style={{padding:"10px",borderRadius:9,border:"none",background:"linear-gradient(135deg,#00b09b,#007055)",color:"#fff",fontWeight:800,fontSize:13,cursor:"pointer",boxShadow:"0 0 14px #00b09b55"}}>
                  ✅ אשר מיקומים
                </button>
                <button onClick={discardChanges} style={{padding:"8px",borderRadius:9,border:"1px solid #e9456044",background:"#1a0810",color:"#e94560",fontWeight:700,fontSize:12,cursor:"pointer"}}>
                  ↩ בטל שינויים
                </button>
              </div>
            )}
            {!hasUnsaved&&(
              <div style={{padding:9,background:"#0b0f1a",borderRadius:7,border:"1px solid #131d2e",fontSize:10,color:"#1e3050",lineHeight:1.7,textAlign:"center"}}>
                {mode==="edit"?"💡 גרור → ✅ אשר → ＋Q":"👁 מצב תצוגה"}
              </div>
            )}
          </>}

          {tab==="music"&&<>
            <div style={{fontSize:11,color:"#e94560",fontWeight:700,letterSpacing:2}}>מוסיקה</div>
            <button onClick={()=>fileInputRef.current?.click()} style={{padding:"12px",borderRadius:9,border:"2px dashed #1a2540",background:"#111827",color:fileName?"#3a8060":"#6a7a8a",cursor:"pointer",fontSize:12,textAlign:"center",width:"100%"}}>
              {fileName
                ?<>🎵 <span style={{fontSize:10}}>{fileName}</span><br/><span style={{fontSize:9,color:audioReady?"#00b09b":"#f5a623"}}>{loadingAudio?"⏳ מעבד...":audioReady?"✅ מוכן":"❌ שגיאה"}</span>{beats.length===0&&audioReady?<span style={{fontSize:9,color:"#3a5060"}}> · מנתח beats...</span>:null}</>
                :<>
                  <div style={{fontSize:18,marginBottom:4}}>🎵</div>
                  <div style={{fontWeight:700,color:"#8a9ab0"}}>בחר קובץ מוסיקה</div>
                  <div style={{fontSize:9,color:"#3a5060",marginTop:3}}>MP3 · AAC · M4A · WAV<br/>מהמחשב, iPhone או iPad</div>
                </>
              }
            </button>
            {/* capture="" lets iOS offer Files + Music Library; accept covers all common audio */}
            <input
              ref={fileInputRef}
              type="file"
              accept="audio/*,audio/mp3,audio/mpeg,audio/mp4,audio/x-m4a,audio/aac,audio/wav,audio/ogg,.mp3,.m4a,.aac,.wav,.ogg,.flac"
              capture={undefined}
              style={{display:"none"}}
              onChange={handleAudioFile}
            />
            {beats.length>0&&<div style={{fontSize:10,color:"#1a4030",textAlign:"center",padding:"4px 8px",background:"#051510",borderRadius:5,border:"1px solid #0a3020"}}>🥁 {beats.length} beats זוהו</div>}

            <div style={{fontSize:11,color:"#e94560",fontWeight:700,letterSpacing:2}}>CUE LIST ({keyframes.length})</div>
            {nextCue&&isPlaying&&<div style={{padding:"5px 9px",background:"#001a33",borderRadius:7,border:"1px solid #003366",fontSize:11,color:"#00aaff",fontWeight:700}}>⏭ {nextCue.label} בעוד {timeToNext?.toFixed(1)}שׁ</div>}
            {keyframes.length===0
              ?<div style={{fontSize:11,color:"#1e2d3a",textAlign:"center",padding:9}}>הגדר פוזיציה → ✅ אשר → הוסף Q</div>
              :<div style={{display:"flex",flexDirection:"column",gap:4}}>
                {sortedKf.map((kf,i)=>(
                  <div key={i} onClick={()=>loadKeyframe(kf)} style={{padding:"7px 9px",borderRadius:7,border:"1px solid",borderColor:activeKf===kf?"#f5a623":"#1a2540",background:activeKf===kf?"#1a1000":"#111827",cursor:"pointer",display:"flex",alignItems:"center",gap:7}}>
                    <div style={{width:24,height:24,borderRadius:"50%",background:activeKf===kf?"#f5a623":"#1a1000",border:"2px solid #f5a623",display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,color:activeKf===kf?"#000":"#f5a623",fontWeight:800,flexShrink:0}}>{i+1}</div>
                    <div style={{flex:1}}>
                      <div style={{fontSize:11,fontWeight:700,color:"#f5a623"}}>{kf.label}</div>
                      <div style={{fontSize:9,color:"#3a5060"}}>{fmt(kf.time)} · {kf.formation}</div>
                    </div>
                    <button onClick={e=>deleteKf(kf,e)} style={{width:18,height:18,borderRadius:"50%",border:"none",background:"#2a1010",color:"#e94560",cursor:"pointer",fontSize:10,flexShrink:0}}>✕</button>
                  </div>
                ))}
              </div>
            }
          </>}
        </div>

        {/* MAIN */}
        <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>

          {/* CANVAS */}
          <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",background:"#06080f",position:"relative",padding:isMobile?4:10,paddingBottom:isMobile&&tab?"220px":isMobile?4:10}}>
            {hasUnsaved&&mode==="edit"&&(
              <div style={{position:"absolute",top:10,left:"50%",transform:"translateX(-50%)",background:"#1a1500",border:"1px solid #f5a62366",borderRadius:7,padding:"5px 16px",fontSize:11,color:"#f5a623",fontWeight:700,zIndex:10,display:"flex",gap:10,alignItems:"center"}}>
                {activeKf ? "✏️ עורך "+activeKf.label : "⚠️ לא שמור"}
                <button onClick={commitPositions} style={{padding:"3px 10px",borderRadius:5,border:"none",background:"#00b09b",color:"#fff",fontWeight:700,fontSize:11,cursor:"pointer"}}>✅ שמור</button>

            {mode==="preview"&&keyframes.length<2&&(
              <div style={{position:"absolute",top:10,left:"50%",transform:"translateX(-50%)",background:"#1a1000",border:"1px solid #f5a62344",borderRadius:7,padding:"5px 14px",fontSize:11,color:"#f5a623",fontWeight:700,zIndex:10}}>

            {nextCue&&isPlaying&&timeToNext!==null&&timeToNext<3&&(
              <div style={{position:"absolute",top:10,right:18,background:"#001a33dd",border:"1px solid #0055aa",borderRadius:7,padding:"5px 13px",fontSize:11,color:"#00aaff",fontWeight:700,zIndex:10}}>

            <div style={{background:"#0a0d16",borderRadius:13,border:`1px solid ${beatFlash?stage.line+"88":"#1a2540"}`,padding:9,boxShadow:beatFlash?`0 0 28px ${stage.line}44`:"0 6px 36px #000c",transition:"box-shadow .1s,border-color .1s"}}>
              <svg ref={svgRef}

          </>}
          {tab==="timeline"&&<>
            <div style={{fontSize:11,color:"#f5a623",fontWeight:700,letterSpacing:2,marginBottom:14}}>⏱ נגן ו-Q</div>
            {/* Big play button */}
            <div style={{display:"flex",justifyContent:"center",marginBottom:14}}>
              <button onClick={togglePlay}
                style={{width:64,height:64,borderRadius:"50%",
                  background:audioReady?(isPlaying?"linear-gradient(135deg,#e94560,#c2185b)":"linear-gradient(135deg,#0f3460,#1565c0)"):"#1a2540",
                  border:"none",color:audioReady?"#fff":"#555",fontSize:28,cursor:audioReady?"pointer":"default",
                  boxShadow:isPlaying?"0 0 20px #e9456088":"0 4px 20px #0008"}}>
                {isPlaying?"⏸":"▶"}
              </button>
            </div>
            {!audioReady&&<div style={{fontSize:11,color:"#445566",textAlign:"center",marginBottom:10}}>העלה MP3 מ-tab מוסיקה כדי לנגן</div>}
            {/* Time display */}
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:8,fontSize:12,fontWeight:700}}>
              <span style={{color:"#f5a623"}}>{fmt(displayTime)}</span>
              <span style={{color:"#3a5060"}}>{fmt(duration)}</span>
            </div>
            {/* Scrubber */}
            <div ref={scrubberRef} onMouseDown={onScrubStart}
              style={{height:44,position:"relative",cursor:"pointer",display:"flex",alignItems:"center",marginBottom:14,touchAction:"none"}}
              onTouchStart={e=>{e.preventDefault();const t=e.touches[0];const r=scrubberRef.current.getBoundingClientRect();seekTo(((t.clientX-r.left)/r.width)*(duration||0));}}
              onTouchMove={e=>{e.preventDefault();const t=e.touches[0];const r=scrubberRef.current.getBoundingClientRect();seekTo(((t.clientX-r.left)/r.width)*(duration||0));}}>
              <div style={{position:"absolute",left:0,right:0,top:"50%",transform:"translateY(-50%)",height:8,background:"#1a2540",borderRadius:4}}>
                {beats.map((b,i)=><div key={i} style={{position:"absolute",left:`${(b/(duration||1))*100}%`,top:0,bottom:0,width:2,background:"#e9456033"}}/>)}
                {sortedKf.map((kf,i)=><div key={i} style={{position:"absolute",left:`${(kf.time/(duration||1))*100}%`,top:-2,bottom:-2,width:3,background:"#f5a623cc"}}/>)}
                <div style={{position:"absolute",left:0,top:0,bottom:0,width:`${pct}%`,background:"linear-gradient(90deg,#e94560,#c77dff)",borderRadius:4}}/>
              </div>
              {sortedKf.map((kf,i)=>(
                <div key={i} onClick={e=>{e.stopPropagation();loadKeyframe(kf);}}
                  style={{position:"absolute",left:`${(kf.time/(duration||1))*100}%`,transform:"translateX(-50%)",top:2,zIndex:4,cursor:"pointer"}}>
                  <div style={{width:18,height:18,borderRadius:"50%",background:activeKf===kf?"#f5a623":"#1a1000",border:"2px solid #f5a623",display:"flex",alignItems:"center",justifyContent:"center",fontSize:8,color:activeKf===kf?"#000":"#f5a623",fontWeight:800}}>{i+1}</div>
                </div>
              ))}
              <div style={{position:"absolute",left:`${pct}%`,top:"50%",transform:"translate(-50%,-50%)",width:22,height:22,borderRadius:"50%",background:"#e94560",border:"3px solid #fff",zIndex:5,boxShadow:"0 0 12px #e94560bb",pointerEvents:"none"}}/>
            </div>
            {/* Add Q button */}
            <button onClick={addKeyframe}
              style={{width:"100%",padding:"12px",borderRadius:10,border:"2px solid #f5a623",
                background:"#1a1000",color:"#f5a623",fontWeight:800,fontSize:14,cursor:"pointer",
                boxShadow:"0 0 12px #f5a62233",letterSpacing:1}}>
              ＋ הוסף Q{keyframes.length+1} @ {fmt(displayTime)}
            </button>
            {nextCue&&isPlaying&&<div style={{marginTop:8,padding:"6px 10px",background:"#001a33",borderRadius:7,border:"1px solid #003366",fontSize:11,color:"#00aaff",fontWeight:700,textAlign:"center"}}>⏭ {nextCue.label} בעוד {timeToNext?.toFixed(1)}שׁ</div>}
          </>}
        </div>
      )}
    </div>
  );
}


    // Mount the app
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(ChoreoPlan));

    // Hide loading screen once app renders
    setTimeout(() => {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        loading.style.transition = 'opacity 0.4s';
        setTimeout(() => loading.remove(), 400);
      }
    }, 800);
  </script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.log('SW error:', err));
      });
    }

    // iOS PWA: prevent bounce scroll on root
    document.addEventListener('touchmove', function(e) {
      if (e.target === document.body || e.target === document.documentElement) {
        e.preventDefault();
      }
    }, { passive: false });
  </script>
</body>
</html>
