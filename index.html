  <script>
/* React hooks from global */
const {

} = React;
const STAGE_PRESETS = [{

const FORMATIONS = [{
  id: "free",
  label: "חופשי",
  icon: "✦"
}, {
  id: "circle",
  label: "עיגול",
  icon: "◯"
}, {
  id: "semicircle_out",
  label: "חצי עיגול חוץ",
  icon: "⌢"
}, {
  id: "semicircle_in",
  label: "חצי עיגול פנים",
  icon: "⌣"
}, {
  id: "grid",
  label: "רשת",
  icon: "⊞"
}, {
  id: "triangle",
  label: "משולש",
  icon: "△"
}, {
  id: "line",
  label: "שורה",
  icon: "▬"
}, {
  id: "diagonal_lr",
  label: "אלכסון ↘",
  icon: "╲"
}, {
  id: "diagonal_rl",
  label: "אלכסון ↙",
  icon: "╱"
}, {
  id: "x_cross",
  label: "X צלב",
  icon: "✕"
}, {
  id: "v",
  label: "V",
  icon: "V"
}, {
  id: "diamond",
  label: "מעויין",
  icon: "◇"
}];
const DIRS = ["↑", "↗", "→", "↘", "↓", "↙", "←", "↖"];
const CW = 680,
  CH = 390;
function lerp(a, b, t) {
  return a + (b - a) * t;
}
function clamp(v, lo, hi) {
  return Math.max(lo, Math.min(hi, v));
}
function easeInOut(t) {
  return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
}
function formationPositions(id, n, W, H) {
  const cx = W / 2,
    cy = H / 2,
    pts = [];
  if (id === "free") {
    // spread in a loose grid so each dancer is individually draggable
    const cols = Math.ceil(Math.sqrt(n));
    const rows = Math.ceil(n / cols);
    const spacingX = Math.min(W * 0.6 / Math.max(cols, 1), W * 0.12);
    const spacingY = Math.min(H * 0.6 / Math.max(rows, 1), H * 0.15);
    const startX = cx - (cols - 1) * spacingX / 2;
    const startY = cy - (rows - 1) * spacingY / 2;
    for (let i = 0; i < n; i++) {
      const col = i % cols,
        row = Math.floor(i / cols);
      pts.push({
        x: startX + col * spacingX,
        y: startY + row * spacingY
      });
    }
  } else if (id === "circle") {
    const r = Math.min(W, H) * 0.35;
    for (let i = 0; i < n; i++) {
      const a = 2 * Math.PI * i / n - Math.PI / 2;
      pts.push({
        x: cx + r * Math.cos(a),
        y: cy + r * Math.sin(a)
      });
    }
  } else if (id === "semicircle_out") {
    const r = Math.min(W, H) * 0.38;
    for (let i = 0; i < n; i++) {
      const a = Math.PI * (i / Math.max(n - 1, 1));
      pts.push({
        x: cx + r * Math.cos(a),
        y: cy - r * 0.75 * Math.sin(a)
      });
    }
  } else if (id === "semicircle_in") {
    const r = Math.min(W, H) * 0.38;
    for (let i = 0; i < n; i++) {
      const a = Math.PI * (i / Math.max(n - 1, 1));
      pts.push({
        x: cx + r * Math.cos(a),
        y: cy + r * 0.75 * Math.sin(a)
      });
    }
  } else if (id === "grid") {
    const cols = Math.ceil(Math.sqrt(n));
    const sx = W * 0.7 / Math.max(cols - 1, 1);
    const sy = H * 0.7 / Math.max(Math.ceil(n / cols) - 1, 1);
    for (let i = 0; i < n; i++) pts.push({
      x: cx - W * 0.35 + i % cols * sx,
      y: cy - H * 0.35 + Math.floor(i / cols) * sy
    });
  } else if (id === "triangle") {
    let row = 0,
      placed = 0;
    const totalRows = Math.ceil((-1 + Math.sqrt(1 + 8 * n)) / 2);
    const sy = H * 0.6 / Math.max(totalRows - 1, 1);
    while (placed < n) {
      const ir = row + 1;
      const sx2 = W * 0.6 / Math.max(ir, 1);
      for (let j = 0; j < ir && placed < n; j++, placed++) pts.push({
        x: cx - (ir - 1) * sx2 / 2 + j * sx2,
        y: cy - (totalRows - 1) * sy / 2 + row * sy
      });
      row++;
    }
  } else if (id === "line") {
    const sp = W * 0.7 / Math.max(n - 1, 1);
    for (let i = 0; i < n; i++) pts.push({
      x: cx - W * 0.35 + i * sp,
      y: cy
    });
  } else if (id === "diagonal_lr") {
    for (let i = 0; i < n; i++) pts.push({
      x: cx - W * 0.35 + i * (W * 0.7 / Math.max(n - 1, 1)),
      y: cy - H * 0.35 + i * (H * 0.7 / Math.max(n - 1, 1))
    });
  } else if (id === "diagonal_rl") {
    for (let i = 0; i < n; i++) pts.push({
      x: cx + W * 0.35 - i * (W * 0.7 / Math.max(n - 1, 1)),
      y: cy - H * 0.35 + i * (H * 0.7 / Math.max(n - 1, 1))
    });
  } else if (id === "x_cross") {
    const half = Math.ceil(n / 2);
    for (let i = 0; i < n; i++) {
      const idx = i % half;
      const t2 = idx / Math.max(half - 1, 1);
      if (i < half) pts.push({
        x: lerp(cx - W * 0.35, cx + W * 0.35, t2),
        y: lerp(cy - H * 0.35, cy + H * 0.35, t2)
      });else pts.push({
        x: lerp(cx + W * 0.35, cx - W * 0.35, t2),
        y: lerp(cy - H * 0.35, cy + H * 0.35, t2)
      });
    }
  } else if (id === "v") {
    for (let i = 0; i < n; i++) {
      const side = i % 2 === 0 ? 1 : -1;
      const step = Math.floor(i / 2);
      pts.push({
        x: cx + side * step * W * 0.07,
        y: cy + step * H * 0.1
      });
    }
  } else if (id === "diamond") {
    pts.push({
      x: cx,
      y: cy
    });
    const step2 = Math.min(W, H) * 0.17;
    let placed = 1,
      l = 1;
    while (placed < n) {
      const d2 = [[0, -1], [1, 0], [0, 1], [-1, 0]];
      for (let s = 0; s < 4 && placed < n; s++) for (let k = 0; k < l && placed < n; k++, placed++) {
        const nx = d2[s][0] * (l - k) + d2[(s + 1) % 4][0] * k;
        const ny = d2[s][1] * (l - k) + d2[(s + 1) % 4][1] * k;
        pts.push({
          x: cx + nx * step2,
          y: cy + ny * step2
        });
      }
      l++;
    }
  }
  return pts.slice(0, n);
}
function makeDancers(n, formation, W, H) {
  return formationPositions(formation, n, W, H).map((p, i) => ({
    id: i,
    x: p.x,
    y: p.y,
    dir: 0,
    name: `R${i + 1}`,
    color: `hsl(${i * 137 % 360},70%,62%)`
  }));
}
async function detectBeats(audioBuffer) {
  const sr = audioBuffer.sampleRate,
    data = audioBuffer.getChannelData(0),
    winSize = Math.floor(sr * 0.05);
  const beats = [];
  let lastBeat = -0.3;
  for (let i = 0; i < data.length - winSize; i += winSize) {
    let e = 0;
    for (let j = 0; j < winSize; j++) e += data[i + j] * data[i + j];
    e /= winSize;
    const t = i / sr;
    if (e > 0.008 && t - lastBeat > 0.25) {
      beats.push(t);
      lastBeat = t;
    }
  }
  return beats;
}
function interpolateDancers(sortedKf, time) {
  if (!sortedKf || sortedKf.length === 0) return null;
  if (sortedKf.length === 1) return sortedKf[0].dancers;
  if (time <= sortedKf[0].time) return sortedKf[0].dancers;
  if (time >= sortedKf[sortedKf.length - 1].time) return sortedKf[sortedKf.length - 1].dancers;
  let prev = sortedKf[0],
    next = sortedKf[1];
  for (let i = 0; i < sortedKf.length - 1; i++) {
    if (time >= sortedKf[i].time && time <= sortedKf[i + 1].time) {
      prev = sortedKf[i];
      next = sortedKf[i + 1];
      break;
    }
  }
  const span = next.time - prev.time;
  const t = easeInOut(span > 0 ? clamp((time - prev.time) / span, 0, 1) : 0);
  return prev.dancers.map((pd, i) => {
    const nd = next.dancers[i] || pd;
    return {
      ...pd,
      x: lerp(pd.x, nd.x, t),
      y: lerp(pd.y, nd.y, t)
    };
  });
}
function ChoreoPlan() {
  const [stagePreset, setStagePreset] = useState(STAGE_PRESETS[0]);
  const [customW, setCustomW] = useState(20);
  const [customH, setCustomH] = useState(15);
  const stage = useMemo(() => stagePreset.id === "custom" ? {
    ...stagePreset,
    w: +customW,
    h: +customH
  } : stagePreset, [stagePreset, customW, customH]);
  const [dancerCount, setDancerCount] = useState(8);
  const [formation, setFormation] = useState("circle");
  const [showGrid, setShowGrid] = useState(false);
  const [gridSize, setGridSize] = useState(8); // grid cells across width
  const [snapToGrid, setSnapToGrid] = useState(false);

  // stageDancers = committed positions (what gets saved to Q)
  // editDancers  = live drag positions (shown on canvas during edit)
  const [stageDancers, setStageDancers] = useState(() => makeDancers(8, "circle", 16, 10));
  const [editDancers, setEditDancers] = useState(() => makeDancers(8, "circle", 16, 10));
  const [hasUnsaved, setHasUnsaved] = useState(false);
  const nextDancerIdRef = useRef(8);
  const [selectedId, setSelectedId] = useState(null);
  const draggingRef = useRef(null);
  const dragOffsetRef = useRef({
    dx: 0,
    dy: 0
  });
  const [keyframes, setKeyframes] = useState([]);
  const [activeKf, setActiveKf] = useState(null);
  const activeKfRef = useRef(null);
  useEffect(() => {
    activeKfRef.current = activeKf;
  }, [activeKf]);

  // ── Web Audio API engine (no HTML <audio> needed) ────────────────────────
  const [fileName, setFileName] = useState("");
  const [beats, setBeats] = useState([]);
  const [duration, setDuration] = useState(0);
  const durationRef = useRef(0);
  const [isPlaying, setIsPlaying] = useState(false);
  const isPlayingRef = useRef(false);
  const [displayTime, setDisplayTime] = useState(0);
  const [renderDancers, setRenderDancers] = useState(() => makeDancers(8, "circle", 16, 10));
  const [beatFlash, setBeatFlash] = useState(false);
  const [audioReady, setAudioReady] = useState(false);
  const [loadingAudio, setLoadingAudio] = useState(false);
  const actxRef = useRef(null);
  const audioBufRef = useRef(null);
  const sourceRef = useRef(null);
  const startTimeRef = useRef(0);
  const offsetRef = useRef(0);
  const fileInputRef = useRef(null);
  const svgRef = useRef(null);

    const el = svgRef.current;
    if (!el) return;
    const prevent = e => {
      if (draggingRef.current !== null) e.preventDefault();
    };
    el.addEventListener("touchmove", prevent, {
      passive: false
    });
    el.addEventListener("touchstart", prevent, {
      passive: false

      el.removeEventListener("touchmove", prevent);
      el.removeEventListener("touchstart", prevent);
    };
  }, []);
  const scrubberRef = useRef(null);
  const rafRef = useRef(null);
  const isScrubbing = useRef(false);
  const wasPlaying = useRef(false);
  const beatFlashRef = useRef(false);
  const beatsRef = useRef([]);
  const keyframesRef = useRef([]);
  const modeRef = useRef("edit");
  const [mode, setMode] = useState("edit");
  const [tab, setTab] = useState("stage");
  const [isMobile, setIsMobile] = useState(false);
  useEffect(() => {
    const chk = () => setIsMobile(window.innerWidth < 700);
    chk();
    window.addEventListener("resize", chk);
    return () => window.removeEventListener("resize", chk);
  }, []);

  // keep keyframesRef always in sync (useEffect is async, so we also update inline)
  useEffect(() => {
    keyframesRef.current = [...keyframes].sort((a, b) => a.time - b.time);
  }, [keyframes]);

    modeRef.current = mode;
  }, [mode]);

    beatsRef.current = beats;
  }, [beats]);

    return actxRef.current;
  };

    if (!actxRef.current || !sourceRef.current) return offsetRef.current;
    return Math.min(offsetRef.current + (actxRef.current.currentTime - startTimeRef.current), duration || 0);

      const s = sourceRef.current;
      const t = actx && s ? Math.min(offsetRef.current + (actx.currentTime - startTimeRef.current), durationRef.current || 9999) : offsetRef.current;
      setDisplayTime(t);
      const dur = durationRef.current;

        setIsPlaying(false);
        offsetRef.current = 0;
        return;

        beatFlashRef.current = near;
        setBeatFlash(near);

    setIsPlaying(false);

      setAudioReady(true);

  };

    const actx = getActx(),
      buf = audioBufRef.current;

      sourceRef.current?.stop();
    } catch (_) {}

    src.connect(actx.destination);

      if (sourceRef.current === src) {
        isPlayingRef.current = false;
        setIsPlaying(false);
        offsetRef.current = 0;
      }
    };

    startTimeRef.current = actx.currentTime;
    offsetRef.current = from;
  };

      const t = getCurrentTime();
      try {
        sourceRef.current?.stop();
      } catch (_) {}

      offsetRef.current = t;
      setDisplayTime(t);
      isPlayingRef.current = false;
      setIsPlaying(false);

      // auto-switch to preview so animation runs

      startPlayback(offsetRef.current);
      isPlayingRef.current = true;

    const el = scrubberRef.current;
    if (!el) return 0;

  };

    e.preventDefault();
    isScrubbing.current = true;
    wasPlaying.current = isPlaying;
    if (isPlaying) {
      try {
        sourceRef.current?.stop();
      } catch (_) {}
      sourceRef.current = null;
      isPlayingRef.current = false;
      setIsPlaying(false);
    }

    const move = ev => {
      if (isScrubbing.current) seekTo(getScrubTime(ev.clientX));
    };

      isScrubbing.current = false;
      if (wasPlaying.current) {
        startPlayback(offsetRef.current);
        isPlayingRef.current = true;
        setIsPlaying(true);
      }

      window.removeEventListener("mouseup", up);

      pw,
      ph,
      ox: (CW - pw) / 2,
      oy: (CH - ph) / 2

  }, [stage]);
  const toPixel = (x, y) => ({
    px: sc.ox + x * sc.s,
    py: sc.oy + y * sc.s
